name: Supabase keepalive

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 09:00 KST
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (DB 쓰기)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # legacy anon 키(eyJ...)면 Bearer 헤더도 함께, publishable 키면 apikey만
          AUTH=()
          case "$SUPABASE_ANON_KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $SUPABASE_ANON_KEY");; esac
          # keepalive_ping() 함수가 keepalive 테이블에 실제로 씀 → Supabase가 활동으로 인식
          code=$(curl -s -o resp.txt -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_ANON_KEY" "${AUTH[@]}" \
            -H "Content-Type: application/json" -d "{}")
          echo "HTTP $code"; cat resp.txt; echo
          # 2xx가 아니면 실패로 표시 → GitHub에서 알림 메일이 옴
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
